name: Build and populate cache

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check package outputs
        run: nix eval --json .#packages.x86_64-linux --apply builtins.attrNames

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: puiyq
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build cacheable packages
        run: nix-build ci.nix -A cacheOutputs --no-out-link

      - name: Trigger NUR update
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=puiyq"
