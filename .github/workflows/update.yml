name: Update packages and flake

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update flake inputs
        run: nix flake update

      - name: Update packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export NIX_PATH="nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')"

          packages=$(nix eval --raw .#packages.x86_64-linux --apply '
            ps: builtins.concatStringsSep "\n" (
              builtins.filter
                (name: (ps.${name}.passthru or { }) ? updateScript)
                (builtins.attrNames ps)
            )
          ')


          while IFS= read -r package; do
            echo "::group::$package"
            nix flake archive .
            if ! nix run nixpkgs#nix-update -- "$package" --flake --use-update-script; then
              echo "::warning title=Update failed::$package"
            fi
            echo "::endgroup::"
          done <<< "$packages"

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update packages and flake inputs"
          title: "chore: update packages and flake inputs"
          body: Automated daily update of flake inputs and package sources.
          branch: automated/update-packages-and-flake
          delete-branch: true
