name: Update packages and flake

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update flake inputs
        run: nix flake update

      - name: Update packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for script in pkgs/by-name/*/update.nu; do
            package=$(basename "$(dirname "$script")")
            echo "::group::$package"
            if ! UPDATE_NIX_ATTR_PATH="$package" \
              UPDATE_NIX_OLD_VERSION="$(nix eval --raw ".#$package.version")" \
              "$script"; then
              echo "::warning title=Update failed::$package"
            fi
            echo "::endgroup::"
          done

      - name: Format
        run: nix fmt

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update packages and flake inputs"
          title: "chore: update packages and flake inputs"
          body: Automated daily update of flake inputs and package sources.
          branch: automated/update-packages-and-flake
          delete-branch: true
